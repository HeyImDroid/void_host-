.divider { height: 1px; background: var(--line); margin: 18px 0; }
.kbd { font-family: var(--mono); font-size: .74rem; padding: 1px 6px; border-radius: 5px; background: var(--bg-4); border: 1px solid var(--line-2); border-bottom-width: 2px; color: var(--text-2); white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 5px; font-size: .64rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--bg-5); color: var(--text-2); vertical-align: middle; white-space: nowrap; flex: none; }
.badge.mod { background: var(--accent); color: #fff; }
.badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.badge.info { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.via { background: transparent; border: 1px solid var(--line-2); color: var(--text-3); text-transform: none; letter-spacing: 0; font-weight: 650; font-size: .68rem; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--bg-4); color: var(--text-2); font-size: .74rem; font-weight: 650; white-space: nowrap; }
.safety { display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 7px 10px 7px 12px; border-radius: 10px; background: color-mix(in srgb, #16a34a 9%, transparent); border: 1px solid color-mix(in srgb, #16a34a 28%, transparent); font-size: .82rem; color: var(--text-2); }
.safety > svg { flex: none; color: #16a34a; }
.safety-text { flex: 1; min-width: 0; line-height: 1.35; }
.safety-text b { color: var(--text); font-weight: 650; }
.safety .ibtn, .safety .btn { flex: none; }
.safety-min { display: inline-flex; align-items: center; gap: 6px; margin: 0 16px; padding: 3px 9px; border-radius: 999px; font-size: .74rem; color: var(--text-3); background: transparent; border: 1px solid color-mix(in srgb, var(--text-3) 35%, transparent); cursor: pointer; align-self: flex-start; font: inherit; font-size: .74rem; }
.safety-min:hover { color: var(--text-2); }
.safety-min svg { color: #16a34a; }
@media (max-width: 640px) { .safety, .safety-min { margin: 0 10px; } .safety { flex-wrap: wrap; } }
.callout { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: .9rem; align-items: flex-start; }
.callout > svg { flex: none; margin-top: 2px; color: var(--accent-text); }
.callout.warn { background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.callout.warn > svg { color: var(--warn); }
.callout.bad { background: color-mix(in srgb, var(--bad) 10%, transparent); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.callout.bad > svg { color: var(--bad); }
.callout.ok { background: color-mix(in srgb, var(--ok) 10%, transparent); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.callout.ok > svg { color: var(--ok); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 48px 24px; color: var(--text-3); }
.empty-ico { width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center; background: var(--bg-3); border: 1px solid var(--line); color: var(--text-2); margin-bottom: 6px; font-size: 30px; }
.empty h3 { color: var(--text); font-size: 1.12rem; }
.empty p { max-width: 440px; }
.empty.sm { padding: 24px 12px; }
.progress { height: 6px; border-radius: 3px; background: var(--bg-5); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s var(--ease); }

/* ---------- avatars & presence ---------- */
.av { --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; background: var(--c, #475569); font-size: calc(var(--s) * .5); line-height: 1; flex: none; position: relative; user-select: none; color: #fff; }
.av.xs { --s: 20px; } .av.sm { --s: 28px; } .av.md { --s: 38px; } .av.lg { --s: 56px; } .av.xl { --s: 86px; }
.av > .dot { position: absolute; right: -1px; bottom: -1px; width: max(10px, calc(var(--s) * .32)); height: max(10px, calc(var(--s) * .32)); border: 3px solid var(--dot-ring, var(--bg-1)); box-sizing: content-box; transform: translate(15%, 15%); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--text-3); }
.dot.online { background: var(--ok); } .dot.away { background: var(--warn); } .dot.dnd { background: var(--bad); } .dot.offline { background: var(--text-3); }
.member { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); width: 100%; text-align: left; }
.member:hover { background: var(--bg-4); }
.member .av { --dot-ring: var(--bg-1); }
.member:hover .av { --dot-ring: var(--bg-4); }
.member-text { flex: 1; min-width: 0; line-height: 1.25; }
.member-name { font-weight: 650; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.member-name > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.member-sub { font-size: .75rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member.away .member-text { opacity: .7; }
.aside-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 16px; }

/* ---------- game cards & hero ---------- */
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.gcard { position: relative; background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur), border-color var(--dur); text-align: left; }
.gcard:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--line-2); }
.cover { position: relative; aspect-ratio: 16 / 8; background: var(--g); display: grid; place-items: center; overflow: hidden; isolation: isolate; }
.cover::before, .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .6; background-image: radial-gradient(1.2px 1.2px at 12% 22%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 28% 68%, #fff 50%, transparent 52%), radial-gradient(1.6px 1.6px at 46% 34%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 63% 78%, #fff 50%, transparent 52%), radial-gradient(1.3px 1.3px at 78% 18%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 88% 58%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 8% 86%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 54% 8%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 36% 92%, #fff 50%, transparent 52%), radial-gradient(1.4px 1.4px at 94% 88%, #fff 50%, transparent 52%); }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, .35)); z-index: -1; }
.cover-ico { font-size: 54px; line-height: 1; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .45)); transition: transform .3s var(--ease); }
.gcard:hover .cover-ico { transform: scale(1.08) rotate(-4deg); }
.cover .badge { position: absolute; left: 10px; top: 10px; background: rgba(0, 0, 0, .45); color: #fff; backdrop-filter: blur(6px); }
.fav { position: absolute; top: 8px; right: 8px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; background: rgba(0, 0, 0, .38); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; transition: transform var(--dur); }
.fav:hover { transform: scale(1.1); }
.fav.on { color: #fbbf24; }
.gcard-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.gcard-name { font-weight: 750; font-size: 1.02rem; display: flex; align-items: center; gap: 6px; }
.gcard-tagline { font-size: .86rem; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.gcard-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; font-size: .78rem; color: var(--text-3); }
.gcard-foot .dot { width: 8px; height: 8px; }
.hero { position: relative; border-radius: var(--r-xl); overflow: hidden; background: var(--g); min-height: 210px; display: flex; align-items: flex-end; gap: 20px; padding: 24px; color: #fff; isolation: isolate; flex-wrap: wrap; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, .55)); }
.hero-ico { width: 92px; height: 92px; border-radius: 26px; background: rgba(0, 0, 0, .25); backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 50px; border: 1px solid rgba(255, 255, 255, .22); flex: none; }
.hero-info { flex: 1; min-width: 200px; }
.hero-info h1 { font-size: 2.1rem; letter-spacing: -.03em; }
.hero-info .dev { opacity: .85; font-size: .92rem; }
.hero-info .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hero-info .tag { background: rgba(255, 255, 255, .16); color: #fff; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- chat ---------- */
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 0 10px; overscroll-behavior: contain; }
.chat-search { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg-1); }
.chat-search .input { height: 32px; padding: 5px 10px; }
.chat-start { padding: 28px 18px 8px; }
.chat-start .big { width: 68px; height: 68px; border-radius: 50%; background: var(--bg-4); display: grid; place-items: center; margin-bottom: 14px; color: var(--text-2); font-size: 32px; }
.chat-start h2 { font-size: 1.55rem; letter-spacing: -.02em; }
.chat-start p { color: var(--text-3); margin-top: 4px; max-width: 640px; }
.msg { position: relative; display: grid; grid-template-columns: 60px minmax(0, 1fr); padding: 2px 56px 2px 0; margin-top: 15px; }
.msg.cont { margin-top: 0; }
.msg:hover { background: var(--msg-hover); }
.msg.mention { background: color-mix(in srgb, var(--warn) 8%, transparent); box-shadow: inset 2px 0 0 var(--warn); }
.msg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); } }
.msg-reply { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-3); margin-bottom: 3px; position: relative; cursor: pointer; min-width: 0; }
.msg-reply::before { content: ""; position: absolute; left: -36px; top: 9px; width: 30px; height: 10px; border-left: 2px solid var(--line-2); border-top: 2px solid var(--line-2); border-top-left-radius: 7px; }
.msg-reply b { color: var(--text-2); font-weight: 650; flex: none; }
.msg-reply .rtext { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.msg-reply:hover .rtext { color: var(--text); }
.msg-gut { grid-column: 1; display: flex; justify-content: center; padding-top: 2px; }
.msg-gut .av { cursor: pointer; }
.msg-time-gut { font-size: .66rem; color: var(--text-3); opacity: 0; padding-top: 4px; white-space: nowrap; }
.msg:hover .msg-time-gut { opacity: 1; }
.msg-main { grid-column: 2; min-width: 0; }
.msg-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.35; }
.msg-name { font-weight: 700; cursor: pointer; }
.msg-name:hover { text-decoration: underline; }
.msg-time { font-size: .72rem; color: var(--text-3); }
.msg-text { color: var(--text); overflow-wrap: anywhere; line-height: 1.5; }
.msg-edited { font-size: .7rem; color: var(--text-3); }
.msg.blocked .msg-main { color: var(--text-3); font-size: .86rem; padding: 2px 0; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.react { display: inline-flex; align-items: center; gap: 5px; height: 25px; padding: 0 8px; border-radius: 13px; background: var(--bg-4); border: 1px solid transparent; font-size: .8rem; font-weight: 700; color: var(--text-2); }
.react:hover { border-color: var(--line-2); }
.react.mine { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent-text); }
.react.add { opacity: 0; }
.msg:hover .react.add { opacity: 1; }
.msg-tools { position: absolute; right: 14px; top: -16px; display: none; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r-sm); box-shadow: 0 6px 16px rgba(0, 0, 0, .25); padding: 2px; z-index: 3; }
.msg:hover .msg-tools, .msg.tools-open .msg-tools, .msg:focus-within .msg-tools { display: flex; }
.msg-tools .ibtn { width: 30px; height: 30px; }
.msg-tools .qr { font-size: 16px; }
.day-sep { display: flex; align-items: center; gap: 10px; margin: 20px 16px 2px; font-size: .72rem; font-weight: 800; color: var(--text-3); }
.day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.new-sep { display: flex; align-items: center; gap: 8px; margin: 12px 16px 0; color: var(--bad); font-size: .66rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; }
.new-sep::before { content: ""; flex: 1; height: 1px; background: var(--bad); }
.sys-msg { display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 22px; color: var(--text-3); font-size: .86rem; margin-top: 10px; }
.sys-msg svg { color: var(--text-3); flex: none; }
.sys-msg b { color: var(--text-2); }
.composer { flex: none; padding: 0 16px 14px; position: relative; }
.composer-bar { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; font-size: .8rem; color: var(--text-2); background: var(--bg-1); border: 1px solid var(--line-2); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; }
.composer-bar b { color: var(--text); }
.composer-bar + .composer-box { border-top-left-radius: 0; border-top-right-radius: 0; }
.composer-box { background: var(--bg-input); border: 1px solid var(--line-2); border-radius: var(--r); display: flex; align-items: flex-end; gap: 2px; padding: 5px 5px 5px 14px; transition: border-color var(--dur), box-shadow var(--dur); }
.composer-box:focus-within { border-color: color-mix(in srgb, var(--accent) 65%, var(--line-2)); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer-input { flex: 1; resize: none; border: 0; background: transparent; outline: none; padding: 7px 0; max-height: 38vh; min-height: 22px; height: 36px; line-height: 1.45; color: var(--text); overflow-y: auto; }
.composer-input::placeholder { color: var(--text-3); }
.composer-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 20px; padding: 3px 2px 0; font-size: .74rem; color: var(--text-3); }
.composer-locked { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--bg-1); border: 1px dashed var(--line-2); color: var(--text-2); font-size: .88rem; }
.composer-locked svg { flex: none; color: var(--text-3); }
.typing { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.typing b { color: var(--text-2); }
.tdots { display: inline-flex; gap: 3px; }
.tdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); animation: tblink 1.2s infinite; }
.tdots i:nth-child(2) { animation-delay: .15s; } .tdots i:nth-child(3) { animation-delay: .3s; }
@keyframes tblink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
.jump { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -10px); z-index: 4; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--accent); color: #fff; font-weight: 700; font-size: .84rem; box-shadow: var(--shadow); white-space: nowrap; }
.ac { position: absolute; left: 16px; right: 16px; bottom: 100%; margin-bottom: 6px; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; z-index: 6; max-height: 260px; overflow: auto; }
.ac-title { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 4px 8px 6px; }
.ac-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; width: 100%; text-align: left; }
.ac-item.sel, .ac-item:hover { background: var(--bg-5); }
.mention-tok { background: var(--accent-soft); color: var(--accent-text); border-radius: 4px; padding: 0 3px; font-weight: 650; }
.mention-tok.me { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.spoiler { background: var(--text-3); color: transparent; border-radius: 4px; cursor: pointer; transition: color .15s, background .15s; padding: 0 2px; }
.spoiler * { visibility: hidden; }
.spoiler.shown { background: var(--bg-5); color: inherit; cursor: auto; }
.spoiler.shown * { visibility: visible; }
.md code { font-family: var(--mono); font-size: .85em; background: var(--code-bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: var(--r-sm); overflow-x: auto; white-space: pre; font-size: .84rem; margin: 6px 0; line-height: 1.5; }
.md pre code { background: none; padding: 0; border: 0; font-size: inherit; }
.md blockquote { margin: 4px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line-2); color: var(--text-2); }
.md a { color: var(--link); word-break: break-word; }
mark.hl { background: color-mix(in srgb, var(--warn) 42%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.chat.compact .msg { grid-template-columns: 46px minmax(0, 1fr); padding-right: 10px; margin-top: 11px; }
.chat.compact .msg.cont { margin-top: 0; }
.chat.compact .msg-reply::before { left: -26px; width: 22px; }
.chat.compact .msg-tools { right: 6px; }
.chat.compact .chat-start { padding: 18px 14px 4px; }
.chat.compact .chat-start h2 { font-size: 1.15rem; }
.chat.compact .chat-start .big { width: 48px; height: 48px; font-size: 22px; }
.chat.compact .composer { padding: 0 10px 10px; }
:root[data-density="compact"] .msg { margin-top: 6px; }
:root[data-density="compact"] .msg.cont { margin-top: 0; }
:root[data-density="compact"] .msg-text { line-height: 1.4; }

/* ---------- wiki ---------- */
.wiki { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; max-width: 1100px; margin: 0 auto; padding: 24px 24px 64px; }
.toc { position: sticky; top: 0; align-self: start; padding-top: 6px; }
.toc-title { font-size: .7rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 8px; }
.toc a { display: block; padding: 5px 10px; border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--text-2); font-size: .88rem; border-left: 2px solid var(--line); text-decoration: none; }
.toc a:hover { background: var(--bg-4); color: var(--text); }
.toc a.active { border-left-color: var(--accent); color: var(--text); font-weight: 650; }
.wiki-top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.wiki-top h1 { font-size: 1.8rem; letter-spacing: -.02em; }
.wsec { padding: 2px 0 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; scroll-margin-top: 16px; }
.wsec:last-child { border-bottom: 0; }
.wsec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.wsec-head h2 { font-size: 1.35rem; flex: 1; min-width: 160px; letter-spacing: -.015em; }
.wsec-tools { display: flex; gap: 2px; align-items: center; }
.wsec-meta { font-size: .76rem; color: var(--text-3); margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.md { line-height: 1.68; overflow-wrap: anywhere; }
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md h1 { font-size: 1.9rem; margin: 6px 0 14px; letter-spacing: -.02em; }
.md h2 { font-size: 1.35rem; margin: 26px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.md h3 { font-size: 1.12rem; margin: 18px 0 8px; }
.md h4, .md h5, .md h6 { font-size: 1rem; margin: 14px 0 6px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
.md li { margin: 3px 0; }
.md hr { border: 0; height: 1px; background: var(--line); margin: 18px 0; }
.md table { border-collapse: collapse; margin: 8px 0 14px; font-size: .9rem; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line-2); padding: 7px 11px; text-align: left; vertical-align: top; }
.md th { background: var(--bg-4); font-weight: 700; }
.props { margin-bottom: 28px; }
.prop { background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.prop + .prop { margin-top: 10px; }
.prop-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prop-title { font-weight: 700; flex: 1; min-width: 140px; }
.prop-summary { font-size: .88rem; color: var(--text-2); }
.prop-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meter-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--bg-5); flex: 1; min-width: 120px; overflow: hidden; }
.meter::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 6 - 1px), color-mix(in srgb, var(--bg-2) 70%, transparent) calc(100% / 6 - 1px) calc(100% / 6)); pointer-events: none; }
.meter-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text-3); z-index: 2; }
.meter-fill { position: absolute; top: 0; bottom: 0; transition: width .35s var(--ease); }
.meter-fill.pos { left: 50%; background: var(--ok); border-radius: 0 5px 5px 0; }
.meter-fill.neg { right: 50%; background: var(--bad); border-radius: 5px 0 0 5px; }
.score { font-weight: 800; font-size: .9rem; min-width: 64px; font-variant-numeric: tabular-nums; }
.score.pos { color: var(--ok); } .score.neg { color: var(--bad); }
.vote { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); background: var(--bg-4); font-weight: 700; font-size: .84rem; color: var(--text-2); border: 1px solid transparent; }
.vote:hover { color: var(--text); border-color: var(--line-2); }
.vote.up.on { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.vote.down.on { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.vote[disabled] { opacity: .45; cursor: not-allowed; }
.diff { white-space: pre-wrap; line-height: 1.65; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; max-height: 52vh; overflow: auto; font-size: .9rem; overflow-wrap: anywhere; }
.diff ins { background: color-mix(in srgb, var(--ok) 24%, transparent); color: var(--text); text-decoration: none; border-radius: 3px; }
.diff del { background: color-mix(in srgb, var(--bad) 24%, transparent); color: var(--text-2); text-decoration: line-through; border-radius: 3px; }
.legend { display: flex; gap: 12px; font-size: .78rem; color: var(--text-3); align-items: center; flex-wrap: wrap; }
.legend ins, .legend del { padding: 0 6px; border-radius: 3px; text-decoration: none; }
.legend ins { background: color-mix(in srgb, var(--ok) 24%, transparent); color: var(--text); }
.legend del { background: color-mix(in srgb, var(--bad) 24%, transparent); color: var(--text); }

/* ---------- overlays ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(3, 3, 10, .62); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fade .15s ease; }
.modal-back.top { place-items: start center; padding-top: 12vh; }
.modal { width: min(520px, 100%); max-height: min(88vh, 920px); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: 0 26px 70px rgba(0, 0, 0, .5); display: flex; flex-direction: column; animation: pop .18s var(--ease); overflow: hidden; }
.modal.sm { width: min(420px, 100%); } .modal.lg { width: min(740px, 100%); } .modal.xl { width: min(1000px, 100%); }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 8px 22px; flex: none; }
.modal-head h2 { font-size: 1.2rem; }
.modal-head p { color: var(--text-3); font-size: .88rem; margin-top: 3px; }
.modal-head .ttl { flex: 1; min-width: 0; }
.modal-body { padding: 8px 22px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-body.flush { padding: 0; }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 18px; background: var(--bg-1); border-top: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.modal-foot .left { margin-right: auto; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.pop { position: fixed; z-index: 120; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); animation: pop .12s var(--ease); max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; }
.menu { padding: 6px; min-width: 210px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--r-sm); font-size: .9rem; color: var(--text-2); text-align: left; font-weight: 550; }
.menu-item:hover, .menu-item:focus-visible { background: var(--accent); color: #fff; outline: none; }
.menu-item.danger { color: var(--bad); }
.menu-item.danger:hover { background: var(--bad-strong); color: #fff; }
.menu-item .k { margin-left: auto; font-size: .74rem; opacity: .7; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 6px; }
.menu-label { padding: 6px 10px 4px; font-size: .7rem; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.pcard { width: 310px; padding: 0; overflow: hidden; }
.pcard-banner { height: 70px; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 40%, #000)); }
.pcard-top { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 14px; margin-top: -40px; }
.pcard-top .av { --dot-ring: var(--bg-3); box-shadow: 0 0 0 5px var(--bg-3); }
.pcard-body { padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.pcard-name { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pcard-tag { color: var(--text-3); font-weight: 600; font-size: .9rem; }
.pcard-sec { background: var(--bg-1); border-radius: var(--r); padding: 10px 12px; font-size: .86rem; }
.pcard-sec h4 { font-size: .68rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.playing { display: flex; align-items: center; gap: 10px; }
.playing .gi { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--g); font-size: 20px; flex: none; }
.emoji-pop { width: 330px; padding: 8px; }
.emoji-tabs { display: flex; gap: 2px; margin-bottom: 6px; overflow-x: auto; }
.emoji-tabs button { height: 30px; padding: 0 8px; border-radius: 6px; font-size: .74rem; font-weight: 700; color: var(--text-3); white-space: nowrap; }
.emoji-tabs button.on, .emoji-tabs button:hover { background: var(--bg-5); color: var(--text); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 230px; overflow: auto; }
.emoji-grid button { font-size: 21px; height: 36px; border-radius: 7px; line-height: 1; }
.emoji-grid button:hover { background: var(--bg-5); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; width: min(380px, calc(100vw - 32px)); }
.toast { pointer-events: auto; display: flex; gap: 12px; align-items: flex-start; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 10px 12px 14px; animation: tin .22s var(--ease); font-size: .9rem; }
.toast.out { animation: tout .2s ease forwards; }
.toast-ico { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-size: 16px; }
.toast.ok .toast-ico { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.toast.bad .toast-ico { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.toast.warn .toast-ico { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.toast-main { flex: 1; min-width: 0; }
.toast-title { font-weight: 750; }
.toast-body { color: var(--text-2); font-size: .85rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.toast-actions { display: flex; gap: 6px; margin-top: 8px; }
@keyframes tin { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes tout { to { opacity: 0; transform: translateX(20px); } }
#tip { position: fixed; z-index: 300; pointer-events: none; background: var(--tip-bg); color: var(--tip-text); font-size: .78rem; font-weight: 650; padding: 6px 10px; border-radius: 7px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); max-width: 280px; opacity: 0; transition: opacity .12s; left: 0; top: 0; }
#tip.show { opacity: 1; }

/* ---------- play stage ---------- */
.stage { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--bg-0); }

.stage-bar { height: var(--head-h); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--bg-1); min-width: 0; }
.stage-title { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 750; }

.bridge-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--text-3); padding: 3px 9px; border-radius: 999px; background: var(--bg-4); white-space: nowrap; }
.bridge-pill .dot { width: 8px; height: 8px; }
.stage-main { flex: 1; min-height: 0; display: flex; position: relative; }
.stage-frame { flex: 1; min-width: 0; position: relative; background: #000; }
.stage-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

.stage-dock { width: 350px; border-left: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; min-width: 0; }
.dock-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
.dock-head .select { height: 32px; padding: 4px 30px 4px 10px; font-size: .86rem; font-weight: 650; }

/* ---------- onboarding ---------- */
#onboard { position: fixed; inset: 0; z-index: 150; overflow: auto; padding: 32px 24px; display: grid; place-items: center; background: radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%), radial-gradient(900px 520px at 108% 112%, color-mix(in srgb, #ec4899 5%, transparent), transparent 62%), var(--bg-0); }
.onb { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; max-width: 1060px; width: 100%; align-items: center; }
.onb-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; margin-bottom: 28px; }
.onb-hero h1 { font-size: clamp(2.3rem, 5vw, 3.6rem); letter-spacing: -.035em; line-height: 1.04; }
.grad { background: linear-gradient(90deg, var(--accent-hi), #f0abfc 60%, #fda4af); -webkit-background-clip: text; background-clip: text; color: transparent; }
.onb-hero > p { font-size: 1.08rem; color: var(--text-2); margin-top: 16px; max-width: 480px; }
.onb-points { display: grid; gap: 16px; margin-top: 30px; }
.onb-point { display: flex; gap: 14px; align-items: flex-start; }
.onb-point .ico { width: 42px; height: 42px; border-radius: 13px; background: var(--bg-3); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent-hi); flex: none; }
.onb-point b { display: block; }
.onb-point span { color: var(--text-3); font-size: .92rem; }
.onb-card { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-xl); padding: 28px; box-shadow: 0 30px 90px rgba(0, 0, 0, .45); }
.onb-card h2 { font-size: 1.35rem; }
.av-pick { display: flex; align-items: center; gap: 16px; margin: 18px 0; }
.emoji-choices { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.emoji-choices button { height: 36px; border-radius: 9px; font-size: 20px; border: 2px solid transparent; line-height: 1; }
.emoji-choices button:hover { background: var(--bg-4); }
.emoji-choices button.on { border-color: var(--accent); background: var(--accent-soft); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); border: 3px solid transparent; outline: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2); }
.swatch.on { border-color: var(--bg-2); box-shadow: 0 0 0 2px var(--text); }
.fineprint { font-size: .78rem; color: var(--text-3); margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; }
.fineprint svg { flex: none; margin-top: 2px; }
.fatal { max-width: 560px; margin: 12vh auto; padding: 32px; text-align: center; }

/* ---------- home / feed / misc views ---------- */
.welcome { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 28px; background: radial-gradient(640px 260px at 0% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%), radial-gradient(520px 240px at 100% 100%, color-mix(in srgb, #ec4899 16%, transparent), transparent 70%), var(--bg-3); border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; }
.welcome h1 { font-size: 1.9rem; letter-spacing: -.025em; }

.welcome-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-lg); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--bg-3)), var(--bg-3)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.banner-ico { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.banner-text { flex: 1; min-width: 0; }

.feed-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }

.feed-ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--bg-4); flex: none; font-size: 18px; }

.ci-box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; color: #fff; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .input-wrap { flex: 1; min-width: 220px; }
.search-ico { position: absolute; left: 11px; color: var(--text-3); pointer-events: none; }
.input.with-ico { padding-left: 36px; }
.info-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: .88rem; }
.info-list dt { color: var(--text-3); }
.info-list dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.feature-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chan-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r); width: 100%; text-align: left; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.step { background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; transition: border-color var(--dur), transform var(--dur); }
.step:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); transform: translateY(-2px); }
.step-n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 800; font-size: .85rem; margin-bottom: 4px; }
.step b { font-size: .98rem; }
.step span { font-size: .84rem; color: var(--text-3); }
.code { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 8px 0 14px; }
.code-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); font-size: .76rem; color: var(--text-3); font-family: var(--mono); background: color-mix(in srgb, var(--bg-4) 40%, transparent); }
.code-head .spacer { flex: 1; }
.code pre { margin: 0 !important; padding: 14px !important; overflow: auto; max-height: 540px; font-family: var(--mono); font-size: .8rem; line-height: 1.6; white-space: pre; tab-size: 2; border: 0 !important; border-radius: 0 !important; background: transparent !important; }
.doc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.console { font-family: var(--mono); font-size: .76rem; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); overflow: auto; padding: 6px; min-height: 0; flex: 1; }
.log-line { padding: 5px 6px; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word; }
.log-line .dir { font-weight: 800; margin-right: 6px; }
.log-line.in .dir { color: var(--info); } .log-line.out .dir { color: var(--ok); } .log-line.err .dir { color: var(--bad); } .log-line.sys .dir { color: var(--warn); }
.log-line .t { color: var(--text-3); margin-right: 6px; }
.embed-block { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg-0) 94%, transparent); backdrop-filter: blur(4px); }
.embed-card { max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.embed-card h2 { margin: 0; font-size: 1.1rem; }
.embed-card p { margin: 0; overflow-wrap: anywhere; }
.sandbox { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; height: calc(100vh - var(--head-h) - 120px); min-height: 460px; }
.sandbox-frame { position: relative; background: #000; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
.sandbox-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.sandbox-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.sticky { position: sticky; top: 16px; }
.repeat-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.repeat-row > .input { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; transition: border-color var(--dur); }
.stat:hover { border-color: var(--line-2); }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-3); }
.stat-num { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-label { font-size: .8rem; color: var(--text-3); font-weight: 650; }

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.table th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 800; white-space: nowrap; }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.qitem { background: var(--bg-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.qitem-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.gthumb { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--g); font-size: 28px; flex: none; }
.gthumb.sm { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
.login-card { max-width: 430px; margin: 7vh auto 0; padding: 32px; }
.shield { width: 76px; height: 76px; border-radius: 24px; background: var(--accent-soft); color: var(--accent-hi); display: grid; place-items: center; margin: 0 auto 18px; }
.caps { display: flex; align-items: center; gap: 6px; color: var(--warn); font-size: .8rem; font-weight: 650; }
.settings { display: grid; grid-template-columns: 210px minmax(0, 1fr); height: min(82vh, 740px); }
.settings-nav { background: var(--bg-1); padding: 16px 10px; border-right: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.settings-nav .nav-item { min-height: 34px; }
.settings-body { padding: 22px 26px 30px; overflow: auto; position: relative; }

.settings-close { position: absolute; top: 14px; right: 14px; }
.qs-input { width: 100%; font-size: 1.08rem; padding: 18px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; outline: none; color: var(--text); }
.qs-list { max-height: 52vh; overflow: auto; padding: 6px; }
.qs-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; width: 100%; text-align: left; }
.qs-item.sel { background: var(--accent-soft); }
.qs-item .qs-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-4); color: var(--text-2); flex: none; font-size: 15px; }
.qs-item .k { margin-left: auto; font-size: .74rem; color: var(--text-3); white-space: nowrap; }
.qs-foot { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: .76rem; color: var(--text-3); }
.lockscreen { flex: 1; display: grid; place-items: center; padding: 24px; }
a.chan-row, a.step, a.stat { color: var(--text); text-decoration: none !important; }
a.chip { text-decoration: none !important; }
.modal.qs { width: min(600px, 100%); }
:root { --wiki-link: #c4b5fd; }
:root[data-theme="light"] { --wiki-link: #7c3aed; }
.wlink { color: var(--wiki-link) !important; font-weight: 600; text-decoration: none !important; }
a.wlink:hover { text-decoration: underline !important; }
.wlink.dead { opacity: .65; cursor: default; }
.wsec.flash { animation: flash 1.6s ease; border-radius: var(--r); }
#chatKick:empty { display: none; }
.kickbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: color-mix(in srgb, var(--bad) 9%, var(--bg-2)); border-bottom: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.kick-text { flex: 1; min-width: 200px; }
.onb.single { grid-template-columns: 1fr; max-width: 470px; gap: 18px; }
.chat-scroll .msgs { padding-bottom: 4px; }
.signal { width: 100%; font-family: var(--mono); font-size: .74rem; min-height: 92px; word-break: break-all; }
.linkstep { display: flex; gap: 12px; align-items: flex-start; }
.linkstep .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 800; font-size: .8rem; display: grid; place-items: center; flex: none; margin-top: 2px; }
.linkstep .body { flex: 1; min-width: 0; }

/* ---------- responsive ---------- */
@media (max-width: 1200px) {
  #app { grid-template-columns: var(--rail-w) var(--side-w) minmax(0, 1fr); }
  .aside { position: fixed; right: 0; top: 0; bottom: 0; z-index: 46; box-shadow: var(--shadow); transform: translateX(105%); transition: transform .2s var(--ease); }
  #app.aside-open .aside { transform: none; }

  .sandbox-side .console { min-height: 260px; }
}

  .onb-points { display: none; }
  .wrap { padding: 16px 16px 40px; }

  .settings { grid-template-columns: 1fr; height: min(86vh, 760px); grid-template-rows: auto minmax(0, 1fr); }
  .settings-nav { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .settings-nav .side-label { display: none; }
  .settings-nav .nav-item { width: auto; white-space: nowrap; }
  .msg { padding-right: 10px; grid-template-columns: 52px minmax(0, 1fr); }
  .msg-tools { right: 6px; }
  .vh-sub { display: none; }

  .hero { padding: 18px; min-height: 180px; }
  .hero-ico { width: 64px; height: 64px; font-size: 34px; border-radius: 18px; }
}

<script type="text/markdown" id="void-guide-src"># Bring your game to Void

Void is a social hub for games that runs from a single HTML file. Add the **Void Connection Kit** to your game and players get a Void window inside your game's tab, with cross-game chat, your game's channels and wiki, and public threads. Your game can also share rich presence, activity and achievements.

> **Short version:** add `void-connection-kit.js` to your game unchanged, call `VoidKit.connect({ gameId, voidUrl: 'https://heyimdroid.github.io/void_host-/', openKey, openButton })`, test it in **Developers → Sandbox**, then submit your game. Only games a moderator has approved can connect.

## How it works

1. Your game's page loads the Connection Kit with its own `<script>` tag.
2. When a player presses your **open key** or **open button**, the kit opens a small Void window inside your game's tab. Players can drag it by its title bar, resize it from the corner, and close it again.
3. The kit and Void talk with `postMessage`. Before Void accepts anything, the kit proves it is the original, unmodified Connection Kit (see **Security**).
4. While the Void window is open in your game, it tells the network every 60 seconds that someone is playing, so your game's page shows a live player count.

Profiles and chats are temporary by design. They live in the player's tab and vanish when it closes.

## Quick start

### 1. Use the official Void address

The official Void is hosted on GitHub Pages at [https://heyimdroid.github.io/void_host-/](https://heyimdroid.github.io/void_host-/). Use that address as your `voidUrl`.

Running your own copy of Void instead? Put `void.html` on any HTTPS host and use its address. A local file can't be embedded in other sites.

### 2. Add the Connection Kit

Download `void-connection-kit.js` from **Developers → Connection Kit** and load it **before your other scripts**:

```html
<script src="void-connection-kit.js"><\/script>
```

Do not edit, bundle or minify this file. Void checks its exact text, and any change, even to a comment, makes Void refuse the connection. Line endings don't matter.

### 3. Connect

```js
const kit = VoidKit.connect({
  gameId: 'your-game-id',                     // your game's ID on Void
  voidUrl: 'https://heyimdroid.github.io/void_host-/',   // the official Void
  openKey: '',                                // a key that opens Void, e.g. 'F8' or 'KeyV'
  openButton: ''                              // a CSS selector for your own button, e.g. '#void-button'
});

kit.on('ready', (user) => console.log('Connected to Void as', user.name));
```

Fill in `openKey`, `openButton`, or both. You can also open the window from your own code with `kit.open()`, `kit.close()` or `kit.toggle()`. The key doesn't fire while the player is typing in a text field, unless it's a function key like `F8`.

### 4. Optional extras

```js
kit.setPresence({ details: 'Level 3: The Caves', state: 'Score 1,240' });   // shown on the player's profile
kit.activity('reached level 10', '🏆');                                      // shown in the activity feed
kit.achievement({ id: 'level-10', name: 'Double Digits', icon: '🔟' });      // announced once per session
kit.subscribe(['general']);                                                  // deliver chat to your game
kit.on('message', (m) => showChat(m.author.name, m.text));
kit.chat('gg everyone!', 'general');                                         // post as the player
```

### 5. Test, then submit

Open **Developers → Sandbox**, load your game's URL and watch every message in the live console. Sandbox traffic never reaches other players. When it works, use **Developers → Submit a game**. A moderator reviews it, and once approved it's listed with its own page, channels, wiki and website links.

Until your game is approved, the Void window inside your game says it can't connect. That's expected: only registered games can connect from their own website. Enter your game's website exactly as it's hosted (for example `https://your-name.github.io/your-game/`), because Void checks it.

## Kit reference

| Call | What it does |
|---|---|
| `VoidKit.connect(options)` | Sets up the kit and returns a client. Options: `gameId`, `voidUrl`, `openKey`, `openButton`, `width`, `height`, `preload`. |
| `kit.open()` / `kit.close()` / `kit.toggle()` | Show or hide the Void window. |
| `kit.on(event, fn)` | Events: `ready`, `message`, `user`, `open`, `close`, `error`, `offline`, `disconnect`. |
| `kit.chat(text, channel)` | Posts a chat message as the player (up to 500 characters). |
| `kit.subscribe(channels)` | Chooses which channels are delivered to your game, e.g. `['general', 'lounge:lounge']`. |
| `kit.setPresence({ details, state })` | Rich presence, throttled for you. |
| `kit.activity(text, icon)` | Posts to the activity feed. |
| `kit.achievement({ id, name, icon })` | Unlocks an achievement once per session. |
| `kit.notify(text)` | Shows a short notice inside Void. |

The Void window loads the first time it opens and keeps running while hidden. Set `preload: true` to load it straight away.

## Security

The Connection Kit is the only code Void accepts a game connection from:

1. **Integrity check.** When the kit says hello, Void sends a random one-time challenge. The kit answers with a SHA-256 hash of the challenge combined with the exact text of its own code, using its own built-in SHA-256. Void computes the same hash from the official kit. If a single character of the kit was changed, the hashes don't match and Void refuses the connection.
2. **Signed messages.** Along with the proof, the kit sends Void a random session key. It goes only to Void's window, so other scripts on your page never see it. Every later message carries a signature made with that key plus an increasing sequence number. Messages from any other code on the page, or replayed messages, are rejected.
3. **Protected from your game's own code.** The kit saves the browser built-ins it needs (hashing, randomness, messaging, timers) the moment it loads. Code that runs later and changes those built-ins can't break or redirect it. That's why the kit must load first.
4. **Registered games only.** The `gameId` must be the ID of a game a moderator approved, and it must match exactly. Unknown IDs are refused.
5. **Website and page check.** Void only accepts the kit from your listed website, or from the websites of the links on your game page. When Void can see the page address (always when your game is on the same website as Void, and on other websites when your page sends it), the page also has to be inside one of your listed addresses. A game at `https://your-name.github.io/other-game/` can't use the ID of `https://your-name.github.io/your-game/`.

**Except URL.** If your game runs inside an embed or on a host whose address changes, so the kit can't run on your listed website, ask a moderator to turn on **Except URL** for your game. Your website stays listed on your page, but Void stops checking where the kit runs. Every other check still applies.

**Sharing a website with other games** (for example itch.io, or several games on one GitHub Pages account): add this to your page's `<head>` so Void can see which page the kit is on. Without it, Void refuses games on shared websites, because it can't tell them apart.

```html
<meta name="referrer" content="no-referrer-when-downgrade">
```

**Suspicious kit alerts.** If a Void window inside a game sees a kit fail these checks (a modified kit, forged or replayed messages, or kit traffic from a website or page that isn't listed for your game), it sends a sealed alert that only Void moderators can read. The alert includes the game ID, the ID the kit sent, the website and page (when visible), the kit version and which checks failed. Moderators are notified while it's active. Testing in the Sandbox never sends alerts.

**Paused connections.** Moderators can temporarily pause connections for one game, or for all games at once. While a game is paused, the Void window in it shows a notice, new connections are refused, and requests fail with the error code `game_paused`. A connected kit also gets an `error` event with that code. Your game keeps running, and Void reconnects by itself when the pause ends.

**What this can't do:** no browser-only system can stop someone who deliberately copies the untouched kit text into their own code, because their browser is fully under their control. The checks above make tampering obvious and break it. Moderator review is the final safeguard.

## Raw protocol

Messages are plain objects: `{ void: '1', type, id, gameId, data, seq, mac }`. The kit handles all of this for you. The handshake is `hello`, then `challenge`, `proof`, `welcome`. After that every message needs a valid `seq` and `mac`. Requests with an `id` get an `ack` or an `error` whose `re` is that id.

## Manifest

| Field | Required | Notes |
|---|---|---|
| `id` | yes | 2–32 lowercase letters, numbers and dashes |
| `name`, `dev` | yes | Game and developer names |
| `url` | yes | Your game's website (`https://`) |
| `links` | no | Up to 4 more `{ label, url }` links, e.g. Play now, Discord, Store |
| `tagline`, `desc` | yes | A short pitch and a description |
| `genres`, `platforms`, `icon`, `colors`, `rating`, `features` | no | Listing details |
| `channels` | no | Up to 6 `{ id, name, topic }`. `general` is always added. |
| `wiki` | no | Up to 8 starter sections `{ title, body }` in Markdown |

## Limits

| What | Limit |
|---|---|
| Chat from games | 5 messages per 5 seconds |
| Presence | 1 update per 2 seconds |
| Activity | 6 posts per minute |
| Notices | 3 per minute |

## FAQ

**Can I restyle the Void window?** You can set its size, but the kit itself must stay unchanged.

**Does Void need a server?** Not to work, but a relay makes it much better. Without one, each Void window reaches the other Void windows in the same browser, and other devices through *Direct Link*. Browsers keep embedded pages separate per website, so a Void window inside your game would only reach other windows of your game in that browser. With a relay set up (see the `void-relay` folder), every Void window, including the ones inside games, reaches everyone. The relay only forwards signed messages and can't forge or read private chats.

**Something isn't working.** Load your game in the Sandbox and read the console. A modified kit shows the error code `kit_modified`.
</script>

    if (done) return;
    done = true; flushQueued = false;
    const sc = new Set(dirty); dirty.clear();
    try { UI.refresh(sc); } catch (e) { console.error('[void] render', e); }

  // rAF batches work with painting; the timer covers tabs/windows where rAF is paused.
  if (!document.hidden) requestAnimationFrame(run);
  setTimeout(run, document.hidden ? 60 : 120);

/* ---------------------------------------------------------------------
   3 · Storage & settings

/* ---------------------------------------------------------------------
   4 · Crypto & passwords (WebCrypto only, no libraries)
   --------------------------------------------------------------------- */

      signPub: b64u(new Uint8Array(await subtle.exportKey('raw', s.publicKey))),

  importDhPub: b64 => subtle.importKey('raw', unb64u(b64), DH, false, []),
  async sign(key, str) { return b64u(new Uint8Array(await subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, key, TE.encode(str)))); },
  async verify(key, sig, str) { try { return await subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, unb64u(sig), TE.encode(str)); } catch (e) { return false; } },

/* Constant-time comparison: always walks the full length, never exits early. */

/* Pairwise keys for private threads (ECDH between two profiles, cached). */

/* ---------------------------------------------------------------------
   6 · Network
   Every event is a signed envelope { i, p, s, k, m?, h }:
     i = id · p = JSON payload · s = profile signature · k = signer public key
     m = moderator signature (optional) · h = hops left across Direct Links
   Transports: BroadcastChannel (tabs in this browser) + Direct Links (WebRTC).
   --------------------------------------------------------------------- */

  inst: rid(8), bc: null, links: new Map(), seen: new Map(), keys: new Map(),

  },
  async send(payload, opts = {}) {
    const env = await this.sign(payload, opts);

  /* Reports are signed with a throwaway key so relaying peers can't see who filed them. */

/* Direct Link (beta): serverless WebRTC. Two people swap an invite code and a reply code. */

  constructor(pc, role) {

      const s = pc.connectionState;
      if (s === 'failed' || s === 'closed') this.close();
      else if (s === 'disconnected') setTimeout(() => { if (pc.connectionState === 'disconnected') this.close(); }, 8000);
      invalidate('net');
    });
  }
  attach(dc) {
    this.dc = dc;
    dc.onopen = () => { this.open = true; Net.links.set(this.id, this); Net.onLinkOpen(this); };
    dc.onclose = () => this.close();
    dc.onmessage = e => this.onMessage(e.data);

  send(obj) {
    if (!this.open || !this.dc || this.dc.readyState !== 'open') return;
    try { this.dc.send(JSON.stringify(obj)); } catch (e) { console.warn('[void] link send failed', e); }
  }
  onMessage(data) {
    if (typeof data !== 'string' || data.length > 250000) return;
    let m; try { m = JSON.parse(data); } catch (e) { return; }

    if (m.c) Net.onLinkControl(this, m); else if (m.e) Net.ingest(m.e, this);
  }

    this.closed = true;
    const was = this.open;

   Vote to kick (public threads)
   Anyone in a thread can start a vote against someone else in it. Voters are the people in the
   thread when the vote starts (minus the target). It passes when yes votes reach half of them

function bindGlobalEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && !t.disabled && !t.classList.contains('disabled')) {
      const fn = Actions[t.dataset.act];
      if (fn) { e.preventDefault(); try { fn(t, e); } catch (err) { console.error(err); } return; }
    }
    const a = e.target.closest('a[data-ext]');
    if (a) { e.preventDefault(); openExternal(a.getAttribute('href')); }
  });
  document.addEventListener('input', e => { const t = e.target.closest('[data-input]'); if (t && Inputs[t.dataset.input]) Inputs[t.dataset.input](t, e); });
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (!Me.profile || $('#app').hidden) return;
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); openSwitcher(); return; }
    if (mod && e.key === '/') { e.preventDefault(); openShortcuts(); return; }
    if (e.key === 'Escape') {
      if (Pop.cur) { Pop.close(); e.preventDefault(); return; }
      const m = Modal.top();
      if (m) { if (m.dismiss) m.close(); e.preventDefault(); return; }
      if ($('#app').classList.contains('drawer') || $('#app').classList.contains('aside-open')) { Actions.closeDrawers(); return; }
    }
    if (e.key === 'Tab' && Modal.top()) trapFocus(Modal.top().el, e);
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]:not(button):not(a):not(input):not(textarea)')) { e.preventDefault(); e.target.click(); }
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && !Modal.top()) {
      const items = $$('#side .nav-item[href^="#/"]');
      const i = items.findIndex(x => x.classList.contains('active'));
      const n = items[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1)];
      if (n) { e.preventDefault(); location.hash = n.getAttribute('href'); }
    }
  });
  const markVisible = () => { for (const v of ChatViews) if (v.isVisible() && v.atBottom()) Chat.markRead(v.cid); updateTitle(); };
  window.addEventListener('focus', markVisible);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) markVisible(); });
  window.addEventListener('resize', debounce(() => invalidate('layout'), 150));
  const bump = throttle(() => { Idle.last = now(); if (Me.idle) { Me.idle = false; Presence.announceSoon(); invalidate('me'); } Admin.touch(); }, 2000);
  ['mousemove', 'keydown', 'pointerdown', 'wheel', 'touchstart', 'focus'].forEach(ev => window.addEventListener(ev, bump, { passive: true }));
  setInterval(() => { if (Me.profile && !Me.idle && now() - Idle.last > IDLE_AFTER) { Me.idle = true; Presence.announceSoon(); invalidate('me'); } }, 30000);
  setInterval(() => invalidate('clock'), 60000);
}

function describeMod(ev) {

  switch (ev.t) {
    case 'mod.ban': return `Banned ${t}${ev.until ? ' for ' + fmtDur(ev.until - ev.ts) : ' permanently'}${ev.reason ? ' · ' + cleanLine(ev.reason, 120) : ''}`;
    case 'mod.unban': return 'Lifted a ban';
    case 'mod.mute': return `Muted ${t} for ${fmtDur(ev.until - ev.ts)}${ev.reason ? ' · ' + cleanLine(ev.reason, 120) : ''}`;
    case 'mod.unmute': return 'Unmuted someone';
    case 'mod.msg.del': return `Removed a message in ${convTitle(String(ev.conv || ''))}`;
    case 'mod.clear': return `Cleared ${convTitle(String(ev.conv || ''))}`;
    case 'mod.slow': return ev.sec ? `Set slow mode to ${ev.sec}s in ${convTitle(String(ev.conv || ''))}` : `Turned off slow mode in ${convTitle(String(ev.conv || ''))}`;
    case 'mod.filter': return `Updated the word filter (${arr(ev.words).length} terms)`;
    case 'mod.announce': return `Posted an announcement: “${cleanLine(ev.title, 60)}”`;
    case 'mod.announce.del': return 'Deleted an announcement';
    case 'mod.game.approve': return `Approved ${cleanLine(ev.game && ev.game.name, 40)}`;
    case 'mod.game.update': return `Edited the ${Games.name(ev.gid)} listing`;
    case 'mod.game.remove': return `Hid ${Games.name(ev.gid)}`;
    case 'mod.game.restore': return `Restored ${Games.name(ev.gid)}`;
    case 'mod.game.feature': return `${ev.on ? 'Featured' : 'Unfeatured'} ${Games.name(ev.gid)}`;
    case 'mod.game.pause': return `Paused connections for ${ev.gid === '*' ? 'all games' : Games.name(ev.gid)}${ev.until ? ' for ' + fmtDur(ev.until - ev.ts) : ' until resumed'}${ev.reason ? ' · ' + cleanLine(ev.reason, 120) : ''}`;
    case 'mod.game.except': return `${ev.on ? 'Turned on' : 'Turned off'} Except URL for ${Games.name(ev.gid)}`;
    case 'mod.game.unpause': return `Resumed connections for ${ev.gid === '*' ? 'all games' : Games.name(ev.gid)}`;
    case 'mod.sub.decide': return ev.decision === 'changes' ? 'Requested changes on a submission' : 'Declined a submission';
    case 'mod.report.resolve': return `Resolved a report${ev.note ? ' · ' + cleanLine(ev.note, 80) : ''}`;
    case 'mod.room.close': return 'Closed a public thread';
    case 'mod.wiki.decide': return `${ev.decision === 'approve' ? 'Published' : 'Deleted'} a wiki proposal in ${Games.name(ev.gid)}`;
    case 'mod.wiki.revert': return `Restored an older wiki version in ${Games.name(ev.gid)}`;
    case 'mod.wiki.lock': return `${ev.on ? 'Locked' : 'Unlocked'} the ${Games.name(ev.gid)} wiki`;
    case 'mod.settings': return `Turned strict voting ${ev.strictVotes ? 'on' : 'off'}`;
    default: return ev.t;
  }
}

function openSettings(tab = 'profile') {
  const st = { tab, draft: { name: Me.profile.name, av: Object.assign({}, Me.profile.av), bio: Me.profile.bio, pronouns: Me.profile.pronouns, custom: Me.profile.custom } };
  const m = Modal.open({ size: 'xl', flush: true, label: 'Settings', body: html`<div class="settings"><nav class="settings-nav" aria-label="Settings sections"><div class="side-label">Settings</div>${SET_TABS.map(([k, l, ic]) => html`<a href="#" class="nav-item ${k === tab ? 'active' : ''}" data-st="${k}"><span class="nav-ico">${icon(ic, 17)}</span><span class="nav-label">${l}</span></a>`)}</nav><div class="settings-body" id="setBody"></div></div>` });
  const body = $('#setBody', m.el);
  const draw = () => {
    $$('[data-st]', m.el).forEach(a => a.classList.toggle('active', a.dataset.st === st.tab));
    body.innerHTML = String(html`<button class="ibtn settings-close" data-close aria-label="Close settings">${icon('x')}</button>${SettingsTabs[st.tab](st)}`);
  };
  m.el.addEventListener('click', async e => {
    const nav = e.target.closest('[data-st]');
    if (nav) { e.preventDefault(); st.tab = nav.dataset.st; draw(); return; }
    const sg = e.target.closest('[data-seg]');
    if (sg) { saveSettings({ [sg.dataset.seg]: sg.dataset.v }); if (sg.dataset.seg === 'dmPolicy') Presence.announceSoon(); draw(); return; }
    const ac = e.target.closest('[data-accent]');
    if (ac) { saveSettings({ accent: ac.dataset.accent }); draw(); return; }
    const pc = e.target.closest('[data-pc]');
    if (pc) { st.draft.av.c = pc.dataset.pc; $$('[data-pc]', m.el).forEach(b => b.classList.toggle('on', b === pc)); $('#sp-av', m.el).innerHTML = String(avatar(st.draft.av, 'xl', Me.status())); return; }
    const pe = e.target.closest('[data-pe]');
    if (pe) { st.draft.av.e = pe.dataset.pe; $$('[data-pe]', m.el).forEach(b => b.classList.toggle('on', b === pe)); $('#sp-av', m.el).innerHTML = String(avatar(st.draft.av, 'xl', Me.status())); return; }
    const sp = e.target.closest('[data-sp]');
    if (!sp) return;
    const a = sp.dataset.sp;
    if (a === 'save') {
      const name = $('#sp-name', m.el).value, err = validateName(name), er = $('#sp-err', m.el);
      if (err) { er.hidden = false; er.textContent = err; return; }
      er.hidden = true;
      Me.update({ name: cleanLine(name, LIMITS.name), av: st.draft.av, pronouns: cleanLine($('#sp-pro', m.el).value, LIMITS.pronouns), custom: cleanLine($('#sp-cus', m.el).value, LIMITS.custom), bio: cleanText($('#sp-bio', m.el).value, LIMITS.bio).trim() });
      Bridges.userChanged();
      toast({ title: 'Profile saved', tone: 'ok' });
    } else if (a === 'testNotify') { Notify.desktop('Void', 'This is what a notification looks like.', 'home', 'test'); toast({ title: 'Test notification', body: 'In-app notifications look like this.', icon: 'bell' }); Sound.ping(); }
    else if (a === 'unblock') { Session.unblock(sp.dataset.uid); draw(); }
    else if (a === 'network') { m.close(); openNetwork(); }
    else if (a === 'clearDevice') {
      if (!(await confirmBox({ title: 'Clear device data?', text: 'Settings and every wiki, moderation, submission and report record on this device will be deleted. Your current session is not affected until you reload.', ok: 'Clear device data', danger: true }))) return;
      for (const k of [K.settings, K.wiki, K.mod, K.subs, K.reports, K.mySubs, K.dismissed, K.pruned, K.auth]) Store.ls.del(k);
      toast({ title: 'Device data cleared', body: 'Reloading…', tone: 'ok' });
      setTimeout(() => location.reload(), 800);
    }
  });
  m.el.addEventListener('change', async e => {
    const t = e.target.closest('[data-set]');
    if (!t) return;
    const k = t.dataset.set;
    if (k === 'desktop' && t.checked) {
      if (!('Notification' in window)) { t.checked = false; return; }
      const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      if (p !== 'granted') { t.checked = false; toast({ title: 'Notifications are blocked', body: 'Allow them for this page in your browser settings.', tone: 'warn' }); return; }
    }
    saveSettings({ [k]: t.checked });
    if (k === 'showGame') Presence.announceSoon();
  });
  draw();

      draw();
    } else if (a === 'join') { st.mode = 'join'; st.reply = ''; draw(); }
    else if (a === 'copyInvite') { if (await copyText(st.invite)) toast({ title: 'Invite code copied', tone: 'ok' }); }
    else if (a === 'copyLink') { if (await copyText(location.origin + location.pathname + '#join=' + st.invite)) toast({ title: 'Invite link copied', body: 'Opening it in a browser starts the join flow.', tone: 'ok' }); }
    else if (a === 'copyReply') { if (await copyText(st.reply)) toast({ title: 'Reply code copied', tone: 'ok' }); }
    else if (a === 'complete') {
      st.reply = ($('#nv-reply', body) || {}).value || st.reply;
      st.busy = true; draw();
      try { const who = await Links.completeInvite(st.reply); st.status = `Connecting to ${who || 'your friend'}…`; } catch (err) { st.error = err.message; }
      st.busy = false; draw();
    } else if (a === 'accept') {
      code = ($('#nv-in', body) || {}).value || code;
      st.busy = true; draw();
      try { const r = await Links.acceptInvite(code); st.reply = r.reply; st.from = r.from; } catch (err) { st.error = err.message || "That invite didn't work. Ask for a new one."; }
      st.busy = false; draw();
    } else if (a === 'close') { const l = Net.links.get(b.dataset.id); if (l) l.close(); draw(); }
    else if (a === 'relaySave') {
      const v = (($('#nv-relay', body) || {}).value || '').trim();
      if (v && !/^wss?:\/\/[^\s]+$/i.test(v)) { toast({ title: 'That address won\'t work', body: 'Relay addresses start with wss:// (or ws:// for testing).', tone: 'warn' }); return; }
      st.relay = null; saveSettings({ relayUrl: v, relayOff: false }); Relay.restart(); draw();
      toast({ title: Relay.target() ? 'Connecting to the relay…' : 'Relay cleared', icon: 'globe' });
    } else if (a === 'relayToggle') { saveSettings({ relayOff: !Settings.relayOff }); Relay.restart(); draw(); }
  });
  draw();
}
function buildSwitcher() {
  const items = [];
  const add = (label, sub, ico, run, kw = '') => items.push({ label, sub, ico, run, kw: (label + ' ' + sub + ' ' + kw).toLowerCase() });
  add('Home', 'Page', icon('home', 16), () => Router.go('home'));
  add('Browse games', 'Page', icon('compass', 16), () => Router.go('games'));
  for (const l of LOUNGE) add('#' + l.name, 'Lounge', icon(l.readonly ? 'megaphone' : 'hash', 16), () => Router.go('lounge/' + l.id));
  for (const g of Games.list()) {
    add(g.name, 'Game', g.icon, () => Router.go('game/' + g.id), g.genres.join(' '));
    add(g.name + ' wiki', 'Wiki', icon('book', 16), () => Router.go('game/' + g.id + '/wiki'));
    for (const c of g.channels) add('#' + c.name, g.name, icon('hash', 16), () => Router.go(`game/${g.id}/c/${c.id}`));
  }
  for (const r of [...Rooms.known.values()].filter(x => !x.closed)) add(r.name, 'Public thread' + (r.gid ? ' · ' + Games.name(r.gid) : ''), icon(r.locked ? 'lock' : 'users', 16), () => Router.go('room/' + r.rid));
  add('Private chats', 'Page', icon('chat', 16), () => Router.go('messages'), 'dm messages private');
  for (const t of Threads.list()) add(Threads.title(t), t.kind === 'dm' ? 'Direct message' : 'Private chat', icon('chat', 16), () => Router.go('dm/' + encodeURIComponent(t.cid)));
  for (const p of Presence.others()) add(p.name + '#' + p.tag, 'Message · ' + STATUS_LABEL[p.status], avatar(p.av, 'xs'), () => { if (Session.isBlocked(p.id)) { openProfile({ x: innerWidth / 2 - 155, y: 120 }, p.id); return; } const t = Threads.ensureDM(p.id, p); Router.go('dm/' + encodeURIComponent(t.cid)); });
  for (const [k, [l]] of Object.entries(DEV_SECTIONS)) add(l, 'Developers', icon('code', 16), () => Router.go('dev/' + k));
  add('Moderation', 'Page', icon('shield', 16), () => Router.go('admin'), 'admin moderator');
  add('Settings', 'Page', icon('settings', 16), () => openSettings(), 'preferences theme profile');
  add('Network & Direct Link', 'Page', icon('network', 16), () => openNetwork(), 'link devices peer');
  add('Keyboard shortcuts', 'Help', icon('zap', 16), () => openShortcuts());
  return items;
}
function openSwitcher() {
  if (Modal.stack.some(x => x.el.classList.contains('qs'))) return;
  const items = buildSwitcher();
  const m = Modal.open({ top: true, cls: 'qs', label: 'Quick switcher', flush: true, body: html`<input class="qs-input" placeholder="Jump to a game, channel, thread, person or page…" aria-label="Search" autocomplete="off" spellcheck="false" role="combobox" aria-controls="qs-list" aria-expanded="true"><div class="qs-list" id="qs-list" role="listbox"></div><div class="qs-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div>` });
  const input = $('.qs-input', m.el), list = $('.qs-list', m.el);
  let shown = [], sel = 0;
  const score = (it, q) => { if (!q) return 1; const i = it.kw.indexOf(q); if (i === 0) return 3; if (i > 0) return 2; let j = 0; for (const ch of it.kw) { if (ch === q[j]) j++; if (j === q.length) return 1; } return 0; };
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    shown = items.map(it => [score(it, q), it]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 40).map(x => x[1]);
    sel = clamp(sel, 0, Math.max(0, shown.length - 1));
    list.innerHTML = String(shown.length ? html`${shown.map((it, i) => html`<div class="qs-item ${i === sel ? 'sel' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}"><span class="qs-ico">${it.ico}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.label}</span><span class="k">${it.sub}</span></div>`)}` : html`<div class="empty sm"><p>Nothing matches “${input.value}”.</p></div>`);
    const s = $('.qs-item.sel', list); if (s) s.scrollIntoView({ block: 'nearest' });
  };
  const run = i => { const it = shown[i]; if (!it) return; m.close(); it.run(); };
  input.addEventListener('input', () => { sel = 0; draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
  });
  list.addEventListener('click', e => { const it = e.target.closest('[data-i]'); if (it) run(+it.dataset.i); });
  draw();
  setTimeout(() => input.focus(), 20);
}
function openShortcuts() {
  const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
  const rows = [[[mod, 'K'], 'Quick switcher'], [[mod, '/'], 'Keyboard shortcuts'], [['Alt', '↑ / ↓'], 'Previous / next item in the sidebar'], [['Enter'], 'Send message'], [['Shift', 'Enter'], 'New line'], [['↑'], 'Edit your last message (in an empty box)'], [['Esc'], 'Cancel reply or edit, close dialogs'], [[mod, 'F'], 'Search the current conversation'], [['@'], 'Mention someone'], [['P'], 'Pause Starfall']];
  Modal.open({ title: 'Keyboard shortcuts', size: 'sm', body: html`<table class="table"><tbody>${rows.map(([keys, d]) => html`<tr><td style="white-space:nowrap">${keys.map((k, i) => html`${i ? ' + ' : ''}<span class="kbd">${k}</span>`)}</td><td class="dim">${d}</td></tr>`)}</tbody></table>` });
}

  Modal.open({ title: 'Community guidelines', sub: 'Void is for every game and every player. Help keep it that way.', body: html`<ol class="md" style="padding-left:20px;margin:0">
    <li><b>Be kind.</b> No harassment, hate, threats or personal attacks.</li>
    <li><b>Keep public spaces safe for everyone.</b> No sexual or graphic content in public channels or threads.</li>
    <li><b>No spam or scams.</b> That includes flooding, unwanted ads and phishing links.</li>
    <li><b>Respect privacy.</b> Never share someone's personal information, and never ask for passwords.</li>
    <li><b>Play fair.</b> Don't share cheats, exploits or stolen content.</li>

    <li><b>Follow each game's own rules</b> in its channels.</li></ol>
    <p class="muted small mt">Moderators can remove content, mute or ban people, and lock wikis. Use Report on any message or profile to flag a problem. Reports are encrypted so only moderators can read them.</p>`, foot: html`<button class="btn primary" data-close>Got it</button>` });
}
Object.assign(Actions, {
  openNetwork: () => openNetwork(),
  openSwitcher: () => openSwitcher(),

function showFatal(reason) {
  $('#app').hidden = true;
  const el = $('#onboard');
  el.hidden = false;
  el.innerHTML = String(html`<div class="card fatal"><div class="shield">${icon('alert', 34)}</div><h1 style="font-size:1.6rem">Void can't start here</h1><p class="dim mt">${reason || 'Void needs the Web Crypto API, which browsers only provide on secure pages.'}</p><p class="muted small mt">Open Void from an <b>https://</b> address, from <b>http://localhost</b>, or by opening the file directly from your computer.</p></div>`);
}
async function startApp(fresh) {
  $('#onboard').hidden = true;
  $('#onboard').innerHTML = '';
  $('#app').hidden = false;
  Boot.at = now();
  bindGlobalEvents();
  Net.init();
  await Session.restore();
  Wiki.prime();
  Presence.start();
  Relay.start();
  let joinCode = null;
  if (/^#join=/.test(location.hash)) { joinCode = decodeURIComponent(location.hash.slice(6)); history.replaceState(null, '', location.pathname + location.search + '#/home'); }
  if (Embed.gid && !location.hash) history.replaceState(null, '', location.pathname + location.search + (Games.has(Embed.gid) ? '#/game/' + Embed.gid : '#/lounge/lounge'));
  Router.init();
  Net.requestSync();
  Embed.start();
  checkBanned();
  if (joinCode) setTimeout(() => openNetwork('join', joinCode), 300);
}
async function boot() {
  applySettings();
  Tip.init();
  if (!CRYPTO_OK || typeof BroadcastChannel === 'undefined' && !Store.ls.ok) { showFatal(); return; }
  try {
    Session.load();
    await Mod.init();
    Games.derive();
    Wiki.init(); Subs.init(); Reports.init();
    const kicked = Store.ss.get('void1.kicked');
    if (kicked) { showKicked(kicked.room); return; }
    if (await Me.restore()) await startApp(false);
    else Onboard.show();
  } catch (e) { console.error('[void] boot failed', e); showFatal('Something went wrong while starting: ' + e.message); }
}
boot();
